name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)

          # Create the release idempotently (ignore "already exists" errors).
          gh release create $tag --title "历史剪贴板 $tag" --notes "历史剪贴板 $tag" 2>$null
          if ($LASTEXITCODE -notin 0, 1) { throw "Failed to create release" }

          # Upload artifacts; asset names match the urls inside latest.yml.
          gh release upload $tag `
            release/history-clipboard-setup-$version.exe `
            release/history-clipboard-setup-$version.exe.blockmap `
            release/latest.yml --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets" }

          # Verify every update-channel file actually landed, so a broken
          # release is reported loudly instead of silently confusing users.
          $names = gh release view $tag --json assets --jq '.assets[].name'
          foreach ($need in @(
            "history-clipboard-setup-$version.exe",
            "history-clipboard-setup-$version.exe.blockmap",
            "latest.yml"
          )) {
            if ($names -notcontains $need) { throw "Missing release asset: $need" }
          }
          Write-Host "Release verified: installer + blockmap + latest.yml"
